generate:
  - types
  - client
accessModifier: public
namingStrategy: idiomatic
# Only the endpoints the app calls. The schema has 157 paths; generating all of
# them would triple build time for code nothing uses. Add a path here when a
# screen starts calling it.
filter:
  paths:
    - /api/auth/password/login
    - /api/auth/password/signup
    - /api/me/entitlements
    - /api/live/quotes
    # Research (slice 2)
    - /api/symbols/search
    - /api/company/{symbol}/overview
    - /api/company/{symbol}/trend
    - /api/sentiment/{symbol}/summary
    - /api/supply-chain/{symbol}/summary
    # Strategies (slice 3)
    - /api/saved-strategies
    - /api/saved-strategies/open-positions
    - /api/saved-strategies/{strategy_id}/signal
    - /api/saved-strategies/{strategy_id}/positions
